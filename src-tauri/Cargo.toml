[package]
name = "era-xvlan-mesh"
version = "0.0.1"
description = "Era XVlan Mesh"
authors = ["EraXvlan Developers <<x@era-x.cn>>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.4", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [ "tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
era-xvlan = { path = "../../../era-xvlan/core" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
once_cell = "1.20"
tracing = "0.1"
tracing-subscriber = "0.3"
md5 = "0.7"

tauri-plugin-shell = "2.2.0"
tauri-plugin-os = "2.2.0"
tauri-plugin-positioner = { version = "2.2.0", features = ["tray-icon"] }
tauri-plugin-process = "2.2.0"
tauri-plugin-notification = "2.2.0"
tauri-plugin-autostart = "2.2.0"
privilege = "0.3"
