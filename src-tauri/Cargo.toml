[package]
name = "era-xvlan-mesh"
version = "0.1.1"
description = "Era XVlan Mesh"
authors = ["EraXvlan Developers <<x@era-x.cn>>"]
edition = "2021"

[lib]
name = "era_xvlan_mesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.2.0", features = [
    "tray-icon",
    "image-png",
    "image-ico",
    "devtools"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

era-xvlan = { path = "../../../era-xvlan/core" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
chrono = { version = "0.4.39", features = ["serde"] }

once_cell = "1.20.2"
dashmap = "6.1"

privilege = "0.3"
gethostname = "0.5"

# tracing = "0.1"
# tracing-subscriber = "0.3"
md5 = "0.7"

tauri-plugin-shell = "2.2.0"
tauri-plugin-process = "2.2.0"
tauri-plugin-positioner = { version = "2.2.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.2.0"
tauri-plugin-vpnservice = { path = "../../../tauri-plugin/vpnservice" }
tauri-plugin-os = "2.2.0"
tauri-plugin-autostart = "2.2.0"
# tauri-plugin-log = "2"

[build-dependencies]
tauri-build = { version = "2.0.4", features = [] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.2.0"
